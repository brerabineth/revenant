name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: lint
        run: shellcheck bin/revenant
      - name: unit tests
        run: bash test/unit_test.sh
      - name: e2e
        run: bash test/e2e_local.sh
      - name: upload host scan for calibration
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-scan
          path: /tmp/rvt-e2e.*/host.json
          if-no-files-found: ignore

  macos-bash-3-2:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: prove the interpreter
        run: /bin/bash --version | head -1
      - name: unit tests (system bash 3.2)
        run: /bin/bash test/unit_test.sh
      - name: e2e (system bash 3.2)
        run: /bin/bash test/e2e_local.sh
